name: ci
on:
  push:
    tags:
      - v*
  pull_request:

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Run Tests
        run: |
          TIMEOUT=1m make test

  lint:
    name: Lint Code
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Run Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  release:
    name: Release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - tests
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Install Ko
        uses: ko-build/setup-ko@v0.10
      - name: Release a New Version
        run: make ci_release
        env:
          RELEASE_TAG: ${{github.ref_name}}
          GH_TOKEN: ${{ github.token }}
